<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141416"/>
      <stop offset="100%" stop-color="#08080A"/>
    </linearGradient>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BEF264"/>
      <stop offset="100%" stop-color="#A3E635"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="glowLime" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect x="16" y="16" width="480" height="480" rx="128" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="3"/>

  <!-- Dial Outer Track (24h Ring) -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="12"/>

  <!-- Telemetry Ticks (24 Segments) -->
  <g stroke="rgba(255,255,255,0.18)" stroke-width="3" stroke-linecap="round">
    <line x1="256" y1="90" x2="256" y2="105"/>
    <line x1="373" y1="139" x2="363" y2="152"/>
    <line x1="422" y1="256" x2="407" y2="256"/>
    <line x1="373" y1="373" x2="363" y2="360"/>
    <line x1="256" y1="422" x2="256" y2="407"/>
    <line x1="139" y1="373" x2="152" y2="360"/>
    <line x1="90" y1="256" x2="105" y2="256"/>
    <line x1="139" y1="139" x2="152" y2="152"/>
  </g>

  <!-- Focus Active Arc (Neon Lime 60% Fill) -->
  <path d="M 256 76 A 180 180 0 1 1 128 382" fill="none" stroke="url(#limeGrad)" stroke-width="14" stroke-linecap="round" filter="url(#glowLime)"/>

  <!-- Secondary Inner Track (Electric Cyan) -->
  <circle cx="256" cy="256" r="125" fill="none" stroke="rgba(56,189,248,0.15)" stroke-width="6" stroke-dasharray="8 8"/>
  <path d="M 256 131 A 125 125 0 0 1 381 256" fill="none" stroke="url(#cyanGrad)" stroke-width="8" stroke-linecap="round" filter="url(#glowCyan)"/>

  <!-- Core Iris Hub -->
  <circle cx="256" cy="256" r="64" fill="#141416" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>
  <circle cx="256" cy="256" r="28" fill="#A3E635" filter="url(#glowLime)"/>
  <circle cx="256" cy="256" r="12" fill="#08080A"/>

  <!-- Danger / Ember Accent Dot (Distraction Caught) -->
  <circle cx="340" cy="340" r="14" fill="#FB923C" stroke="#141416" stroke-width="3"/>
</svg>
